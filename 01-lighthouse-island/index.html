<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>漂浮灯塔海岛 · Three.js Vibe Coding 演示</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      user-select: none;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
    }
    .hud {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      transition: opacity 0.25s ease;
    }
    .hud.is-hidden { opacity: 0; pointer-events: none; }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.24);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .badge.is-sunset {
      background: rgba(251, 146, 60, 0.26);
      color: #fed7aa;
      border-color: rgba(251, 146, 60, 0.5);
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .hud p {
      font-size: 12px;
      color: rgba(241, 245, 249, 0.78);
    }
    .preset-bar {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .preset-bar button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preset-bar button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .preset-bar button.is-active {
      background: rgba(251, 191, 36, 0.28);
      border-color: rgba(251, 191, 36, 0.65);
      color: #fef3c7;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>
  <aside class="hud" id="hud">
    <div class="hud-row">
      <span class="badge" id="mode-badge">V1 · 正午默认光效</span>
      <h1>漂浮灯塔海岛</h1>
    </div>
    <p>拖拽旋转视角 · 滚轮缩放 · 按 <b>H</b> 隐藏面板（文件改动自动热更新）</p>
    <div class="preset-bar">
      <button type="button" id="btn-v1">1 · 白昼起点</button>
      <button type="button" id="btn-v2" hidden>2 · 黄昏波光与萤火虫（对照预览）</button>
    </div>
  </aside>
  <script type="module" src="./main.js"></script>
</body>
</html>
